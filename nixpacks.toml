[phases.setup]
aptPkgs = [
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
    "shared-mime-info",
    "libgobject-2.0-0",
    "libcairo2",
    "libpangoft2-1.0-0"
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python3 app_with_auth.py"

