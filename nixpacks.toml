# Railway configuration for Python app with PDF generation
# Adds system libraries needed for WeasyPrint (PDF generation)

[phases.setup]
aptPkgs = [
    "libglib2.0-0",
    "libgobject-2.0-0", 
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libpangoft2-1.0-0",
    "libcairo2",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
    "shared-mime-info",
    "fontconfig"
]

# Let nixpacks auto-detect Python and handle pip install
# No need to override [phases.install] - it will detect requirements.txt automatically

