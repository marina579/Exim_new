<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing - Marineco AI Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            min-height: 100vh;
            padding: 2rem 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
        }
        
        .container {
            max-width: 1000px;
        }
        
        .nav-header {
            background: white;
            border: 1px solid #d1dce5;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(44, 62, 80, 0.08);
        }
        
        .nav-header a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin: 0 0.5rem;
            transition: all 0.3s ease;
        }
        
        .nav-header a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        
        .card {
            background: #ffffff;
            border: 1px solid #d1dce5;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(44, 62, 80, 0.08);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 2rem;
            border-bottom: 3px solid #3498db;
        }
        
        .card-header h3 {
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .progress {
            height: 40px;
            background: #ecf0f1;
            border: 2px solid #d1dce5;
            border-radius: 50px;
            overflow: hidden;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #3498db, #2980b9);
            font-weight: 600;
            font-size: 1.1rem;
            transition: width 0.3s ease;
        }
        
        .status-box {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.5rem;
            opacity: 0.95;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-download:hover {
            background: linear-gradient(135deg, #229954 0%, #27ae60 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
            color: white;
        }
        
        .btn-outline-dark {
            border: 2px solid #2c3e50;
            color: #2c3e50;
            padding: 10px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-outline-dark:hover {
            background: #2c3e50;
            color: white;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ecf0f1;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .complete-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .complete-icon i {
            font-size: 3rem;
            color: white;
        }
        
        .alert-danger {
            background: #ffebee;
            border-left: 4px solid #e74c3c;
            padding: 1.5rem;
            border-radius: 8px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation Header -->
        <div class="nav-header">
            <div class="text-center">
                <a href="{{ url_for('index') }}">
                    <i class="fas fa-home me-1"></i>Home
                </a>
                <a href="{{ url_for('step2') }}">
                    <i class="fas fa-upload me-1"></i>Bulk Upload
                </a>
                <a href="{{ url_for('chatbot') }}">
                    <i class="fas fa-comments me-1"></i>Chatbot
                </a>
                <a href="{{ url_for('view_contacts') }}">
                    <i class="fas fa-users me-1"></i>Contacts
                </a>
                {% if session.get('is_admin') %}
                <a href="{{ url_for('admin_users') }}">
                    <i class="fas fa-users-cog me-1"></i>Admin Panel
                </a>
                {% endif %}
            </div>
        </div>
        
        <div class="card">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-cog fa-spin me-2"></i>
                    Processing Your File
                </h3>
            </div>
            <div class="card-body p-4">
                <div id="processingContent">
                    <div class="text-center mb-4">
                        <div class="spinner"></div>
                        <p class="text-muted">Initializing...</p>
                    </div>
                </div>

                <div id="progressBar" class="mb-4" style="display: none;">
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 0%">
                            <span id="progressText">0%</span>
                        </div>
                    </div>
                </div>

                <div id="statusMessage" class="status-box" style="display: none;">
                    <i class="fas fa-info-circle me-2"></i>
                    <span id="statusText">Processing...</span>
                </div>

                <div id="statsRow" class="row g-3 mt-3" style="display: none;">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <span class="stat-number" id="statPhone">0</span>
                            <div class="stat-label"><i class="fas fa-phone me-1"></i>Phone</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <span class="stat-number" id="statEmail">0</span>
                            <div class="stat-label"><i class="fas fa-envelope me-1"></i>Email</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <span class="stat-number" id="statWhatsApp">0</span>
                            <div class="stat-label"><i class="fab fa-whatsapp me-1"></i>WhatsApp</div>
                        </div>
                    </div>
                </div>

                <div id="completeContent" class="text-center mt-4" style="display: none;">
                    <div class="complete-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    <h4 class="mb-4" style="font-weight: 900;">Processing Complete!</h4>
                    <div id="zohoSyncSummary" style="display: none; margin-bottom: 1.5rem;"></div>
                    <a href="" id="downloadBtn" class="btn-download">
                        <i class="fas fa-download me-2"></i>Download Results
                    </a>
                    <div class="mt-4">
                        {% if step == 1 %}
                            <a href="{{ url_for('step2') }}" class="btn btn-outline-dark">
                                <i class="fas fa-arrow-right me-2"></i>Proceed to Step 2
                            </a>
                        {% else %}
                            <a href="{{ url_for('index') }}" class="btn btn-outline-dark">
                                <i class="fas fa-home me-2"></i>Back to Home
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const fileId = "{{ file_id }}";
        const step = {{ step }};
        
        function updateProgress() {
            fetch(`/api/progress/${fileId}`)
                .then(response => response.json())
                .then(data => {
                    console.log('Progress data:', data);
                    
                    // Update progress bar
                    const percentage = data.percentage || 0;
                    document.querySelector('.progress-bar').style.width = percentage + '%';
                    document.getElementById('progressText').textContent = percentage + '%';
                    document.getElementById('progressBar').style.display = 'block';
                    
                    // Update status message
                    document.getElementById('statusText').textContent = data.message || 'Processing...';
                    document.getElementById('statusMessage').style.display = 'block';
                    
                    // Update stats (Step 2 only)
                    if (step === 2 && data.stats) {
                        document.getElementById('statPhone').textContent = data.stats.phone || 0;
                        document.getElementById('statEmail').textContent = data.stats.email || 0;
                        document.getElementById('statWhatsApp').textContent = data.stats.whatsapp || 0;
                        document.getElementById('statsRow').style.display = 'flex';
                    }
                    
                    // Check if complete
                    if (data.status === 'complete') {
                        document.getElementById('processingContent').style.display = 'none';
                        document.getElementById('progressBar').style.display = 'none';
                        document.getElementById('completeContent').style.display = 'block';
                        document.getElementById('downloadBtn').href = `/download/${fileId}/${step}`;
                        
                        // Show Zoho sync summary if available
                        if (data.zoho_sync && data.zoho_sync.total > 0) {
                            const zohoDiv = document.getElementById('zohoSyncSummary');
                            if (zohoDiv) {
                                zohoDiv.style.display = 'block';
                                zohoDiv.innerHTML = `
                                    <div class="alert alert-info" style="text-align: left; max-width: 600px; margin: 0 auto;">
                                        <h6><i class="fas fa-cloud-upload-alt me-2"></i>Zoho CRM Sync Summary</h6>
                                        <p class="mb-1"><strong>✅ ${data.zoho_sync.pushed || 0}</strong> contacts synced to Zoho</p>
                                        <p class="mb-1"><strong>⏭️ ${data.zoho_sync.skipped || 0}</strong> contacts already exist in Zoho (duplicates)</p>
                                        ${data.zoho_sync.failed > 0 ? `<p class="mb-0"><strong>❌ ${data.zoho_sync.failed}</strong> contacts failed to sync</p>` : ''}
                                        <p class="mb-0 mt-2 small text-muted">Check the downloaded Excel file for "Zoho Status" column to see which contacts already exist.</p>
                                    </div>
                                `;
                            }
                        }
                    } else if (data.status === 'error') {
                        document.getElementById('processingContent').innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Error:</strong> ${data.message}
                            </div>
                        `;
                    } else {
                        // Continue polling
                        setTimeout(updateProgress, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    setTimeout(updateProgress, 2000);
                });
        }
        
        // Start progress updates
        updateProgress();
    </script>
</body>
</html>
