<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Campaigns - Marineco AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .campaign-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s;
        }
        .campaign-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .status-sent { background: #28a745; color: white; }
        .status-scheduled { background: #ffc107; color: black; }
        .status-failed { background: #dc3545; color: white; }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        .loading-spinner {
            display: none;
        }
        .loading-spinner.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-envelope"></i> Email Campaigns
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard"><i class="fas fa-chart-bar"></i> Dashboard</a>
                <a class="nav-link" href="/view_contacts"><i class="fas fa-users"></i> Contacts</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="fas fa-bullhorn"></i> Email Campaign Management</h2>
                <p class="text-muted">Track and manage your email campaigns</p>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="campaignTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="scheduled-tab" data-bs-toggle="tab" data-bs-target="#scheduled" type="button">
                    <i class="fas fa-calendar"></i> Scheduled Campaigns
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="sent-tab" data-bs-toggle="tab" data-bs-target="#sent" type="button">
                    <i class="fas fa-paper-plane"></i> Sent Campaigns
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="create-tab" data-bs-toggle="tab" data-bs-target="#create" type="button">
                    <i class="fas fa-plus"></i> Create Campaign
                </button>
            </li>
        </ul>

        <div class="tab-content" id="campaignTabsContent">
            <!-- Scheduled Campaigns Tab -->
            <div class="tab-pane fade show active" id="scheduled" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h4>Scheduled Campaigns</h4>
                    <button class="btn btn-primary" onclick="loadScheduledCampaigns()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
                <div id="scheduledCampaignsList" class="loading-spinner">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sent Campaigns Tab -->
            <div class="tab-pane fade" id="sent" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h4>Sent Campaigns & Tracking</h4>
                    <button class="btn btn-primary" onclick="loadSentCampaigns()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
                <div id="sentCampaignsList" class="loading-spinner">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Create Campaign Tab -->
            <div class="tab-pane fade" id="create" role="tabpanel">
                <h4>Create New Campaign</h4>
                <form id="createCampaignForm" class="mt-4">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Campaign Name *</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">List Key *</label>
                            <input type="text" class="form-control" name="list_key" required placeholder="marketing_list">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Template Key *</label>
                            <input type="text" class="form-control" name="template_key" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Subject *</label>
                            <input type="text" class="form-control" name="subject" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">From Email *</label>
                            <input type="email" class="form-control" name="from_email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">From Name</label>
                            <input type="text" class="form-control" name="from_name" value="Marineco AI">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Schedule Type *</label>
                            <select class="form-select" name="schedule_type" id="scheduleType" required>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                                <option value="once">Once</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Schedule Time *</label>
                            <input type="time" class="form-control" name="schedule_time" required value="09:00">
                        </div>
                        <div class="col-md-4 mb-3" id="scheduleDayContainer" style="display: none;">
                            <label class="form-label">Day</label>
                            <input type="number" class="form-control" name="schedule_day" min="0" max="31" placeholder="0=Monday, 1=Tuesday...">
                        </div>
                    </div>
                    <div class="row" id="startDateContainer" style="display: none;">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="start_date">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="enabled" id="enabled" checked>
                            <label class="form-check-label" for="enabled">Enable Campaign</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Create Campaign
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Campaign Report Modal -->
    <div class="modal fade" id="campaignReportModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Campaign Tracking Report</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="campaignReportContent">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Load scheduled campaigns on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadScheduledCampaigns();
            
            // Handle schedule type change
            document.getElementById('scheduleType').addEventListener('change', function() {
                const type = this.value;
                const dayContainer = document.getElementById('scheduleDayContainer');
                const dateContainer = document.getElementById('startDateContainer');
                
                if (type === 'weekly' || type === 'monthly') {
                    dayContainer.style.display = 'block';
                } else {
                    dayContainer.style.display = 'none';
                }
                
                if (type === 'once') {
                    dateContainer.style.display = 'block';
                } else {
                    dateContainer.style.display = 'none';
                }
            });
        });

        function loadScheduledCampaigns() {
            const container = document.getElementById('scheduledCampaignsList');
            container.classList.add('active');
            container.innerHTML = '<div class="text-center"><div class="spinner-border"></div></div>';
            
            fetch('/api/campaigns/scheduled')
                .then(res => res.json())
                .then(data => {
                    container.classList.remove('active');
                    if (data.status === 'success') {
                        displayScheduledCampaigns(data.campaigns);
                    } else {
                        container.innerHTML = `<div class="alert alert-warning">${data.message || 'No scheduled campaigns'}</div>`;
                    }
                })
                .catch(err => {
                    container.classList.remove('active');
                    container.innerHTML = `<div class="alert alert-danger">Error loading campaigns: ${err.message}</div>`;
                });
        }

        function displayScheduledCampaigns(campaigns) {
            const container = document.getElementById('scheduledCampaignsList');
            
            if (!campaigns || campaigns.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No scheduled campaigns. Create one in the "Create Campaign" tab.</div>';
                return;
            }
            
            let html = '<div class="row">';
            campaigns.forEach(campaign => {
                const statusClass = campaign.enabled ? 'status-scheduled' : 'status-failed';
                const statusText = campaign.enabled ? 'Active' : 'Disabled';
                const lastSent = campaign.last_sent_at ? new Date(campaign.last_sent_at).toLocaleString() : 'Never';
                
                html += `
                    <div class="col-md-6">
                        <div class="campaign-card">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5>${campaign.name}</h5>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <p class="text-muted mb-2"><strong>Subject:</strong> ${campaign.subject}</p>
                            <p class="text-muted mb-2"><strong>Schedule:</strong> ${campaign.schedule_type} at ${campaign.schedule_time}</p>
                            <p class="text-muted mb-2"><strong>Last Sent:</strong> ${lastSent}</p>
                            <div class="mt-3">
                                <button class="btn btn-sm btn-primary" onclick="editCampaign(${campaign.id})">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteCampaign(${campaign.id})">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                                ${campaign.last_campaign_id ? `
                                    <button class="btn btn-sm btn-info" onclick="viewReport('${campaign.last_campaign_id}')">
                                        <i class="fas fa-chart-line"></i> View Report
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function loadSentCampaigns() {
            const container = document.getElementById('sentCampaignsList');
            container.classList.add('active');
            container.innerHTML = '<div class="text-center"><div class="spinner-border"></div></div>';
            
            fetch('/api/campaigns/all?limit=50')
                .then(res => res.json())
                .then(data => {
                    container.classList.remove('active');
                    if (data.status === 'success') {
                        displaySentCampaigns(data.campaigns);
                    } else {
                        container.innerHTML = `<div class="alert alert-warning">${data.message || 'No sent campaigns'}</div>`;
                    }
                })
                .catch(err => {
                    container.classList.remove('active');
                    container.innerHTML = `<div class="alert alert-danger">Error loading campaigns: ${err.message}</div>`;
                });
        }

        function displaySentCampaigns(campaigns) {
            const container = document.getElementById('sentCampaignsList');
            
            if (!campaigns || campaigns.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No sent campaigns yet.</div>';
                return;
            }
            
            let html = '<div class="row">';
            campaigns.forEach(campaign => {
                const campaignId = campaign.campaign_key || campaign.campaign_id;
                html += `
                    <div class="col-md-6 mb-3">
                        <div class="campaign-card">
                            <h5>${campaign.campaign_name || 'Unnamed Campaign'}</h5>
                            <p class="text-muted mb-3">${campaign.subject || 'No subject'}</p>
                            <button class="btn btn-primary btn-sm" onclick="viewReport('${campaignId}')">
                                <i class="fas fa-chart-line"></i> View Tracking Report
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function viewReport(campaignId) {
            const modal = new bootstrap.Modal(document.getElementById('campaignReportModal'));
            const content = document.getElementById('campaignReportContent');
            content.innerHTML = '<div class="text-center"><div class="spinner-border"></div></div>';
            modal.show();
            
            fetch(`/api/campaigns/reports/${campaignId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        displayReport(data.report);
                    } else {
                        content.innerHTML = `<div class="alert alert-danger">${data.message || 'Failed to load report'}</div>`;
                    }
                })
                .catch(err => {
                    content.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
                });
        }

        function displayReport(report) {
            const content = document.getElementById('campaignReportContent');
            
            // Metrics cards
            let html = `
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="metric-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <div class="metric-value">${report.sent || 0}</div>
                            <div class="metric-label">Emails Sent</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="metric-value">${report.delivered || 0}</div>
                            <div class="metric-label">Delivered</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                            <div class="metric-value">${report.open_rate || 0}%</div>
                            <div class="metric-label">Open Rate</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                            <div class="metric-value">${report.click_rate || 0}%</div>
                            <div class="metric-label">Click Rate</div>
                        </div>
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6>Opened</h6>
                                <h3>${report.opened || 0}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6>Clicked</h6>
                                <h3>${report.clicked || 0}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h6>Bounced</h6>
                                <h3 class="text-danger">${report.bounced || 0}</h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6>Unsubscribed</h6>
                                <h3>${report.unsubscribed || 0}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6>Bounce Rate</h6>
                                <h3 class="text-warning">${report.bounce_rate || 0}%</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        function editCampaign(id) {
            alert('Edit functionality coming soon!');
        }

        function deleteCampaign(id) {
            if (confirm('Are you sure you want to delete this campaign?')) {
                fetch(`/api/campaigns/scheduled/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            loadScheduledCampaigns();
                        } else {
                            alert('Error: ' + data.message);
                        }
                    });
            }
        }

        // Create campaign form
        document.getElementById('createCampaignForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.enabled = document.getElementById('enabled').checked;
            
            fetch('/api/campaigns/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Campaign created successfully!');
                    this.reset();
                    loadScheduledCampaigns();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(err => alert('Error: ' + err.message));
        });

        // Switch to sent tab when clicked
        document.getElementById('sent-tab').addEventListener('shown.bs.tab', function() {
            loadSentCampaigns();
        });
    </script>
</body>
</html>
